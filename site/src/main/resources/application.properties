spring.application.name=site

# Ativa o reinício automático durante o desenvolvimento
spring.devtools.restart.enabled=true

# Monitora as alterações nos arquivos HTML, CSS e JavaScript
spring.devtools.restart.additional-paths=src/main/resources

# Permite que mudanças nos arquivos estáticos também provoquem reinício
spring.devtools.restart.exclude=META-INF/maven/**,META-INF/resources/**,**/*Test.class,**/*Tests.class,**/*TestCase.class
